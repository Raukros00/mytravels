<div class="page-wrapper">
  <div class="app-container detail-container">

    <a routerLink="/trips" class="back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Tutti i viaggi
    </a>

    @if (trip(); as t) {
      <app-trip-hero
        [trip]="t"
        [status]="currentTripStatus()"
        (share)="shareTrip()" />

      <!-- Navigation Tabs Bar -->
      <nav class="trip-tabs-nav" aria-label="Sezioni viaggio">
        <button
          type="button"
          class="trip-tab-btn"
          [class.trip-tab-btn--active]="activeTab() === 'itinerary'"
          (click)="activeTab.set('itinerary')">
          <span class="material-symbols-outlined">calendar_month</span>
          <span>Itinerario</span>
        </button>

        <button
          type="button"
          class="trip-tab-btn"
          [class.trip-tab-btn--active]="activeTab() === 'food'"
          (click)="activeTab.set('food')">
          <span class="material-symbols-outlined">restaurant</span>
          <span>Food & Drink</span>
          @if (t.placesToEat?.length) {
            <span class="trip-tab-counter">{{ t.placesToEat?.length }}</span>
          }
        </button>

        <button
          type="button"
          class="trip-tab-btn"
          [class.trip-tab-btn--active]="activeTab() === 'flights'"
          (click)="activeTab.set('flights')">
          <span class="material-symbols-outlined">flight_takeoff</span>
          <span>Logistica</span>
        </button>

        <button
          type="button"
          class="trip-tab-btn"
          [class.trip-tab-btn--active]="activeTab() === 'expenses'"
          (click)="activeTab.set('expenses')">
          <span class="material-symbols-outlined">payments</span>
          <span>Spese</span>
          @if (expensesCount()) {
            <span class="trip-tab-counter">{{ expensesCount() }}</span>
          }
        </button>

        <button
          type="button"
          class="trip-tab-btn"
          [class.trip-tab-btn--active]="activeTab() === 'activities'"
          (click)="activeTab.set('activities')">
          <span class="material-symbols-outlined">explore</span>
          <span>Attività</span>
          @if (t.activities?.length) {
            <span class="trip-tab-counter">{{ t.activities?.length }}</span>
          }
        </button>
      </nav>

      @switch (activeTab()) {
        @case ('itinerary') {
          <app-trip-itinerary
            [tripDays]="tripDaysNumbers()"
            [selectedDay]="selectedDay()"
            [timelineItems]="selectedDayTimelineItems()"
            [mapStops]="selectedDayMapStops()"
            [mapCenter]="mapCenter()"
            [dayFoodCount]="selectedDayFoodCount()"
            [dayActivityCount]="selectedDayActivityCount()"
            [startDate]="t.startDate"
            (daySelected)="selectedDay.set($event)"
            (addStep)="openPlanFromBacklogModal()"
            (unassignItem)="unassignFromDay($event)" />
        }

        @case ('food') {
          <app-trip-food-tab
            [places]="t.placesToEat"
            [activities]="t.activities"
            [mapCenter]="mapCenter()"
            [(searchQuery)]="foodSearchQuery"
            [(filter)]="selectedFoodFilter"
            (addPlace)="isPlaceModalOpen.set(true)"
            (assignPlace)="openAssignDayModal($event, 'food')"
            (deletePlace)="deletePlaceToEat($event)" />
        }

        @case ('flights') {
          <app-trip-logistics-tab
            [trip]="t"
            [(subTab)]="activeLogisticsTab"
            (editFlights)="isFlightsModalOpen.set(true)"
            (editHotel)="isAccommodationModalOpen.set(true)"
            (editTransfers)="isTransfersModalOpen.set(true)" />
        }

        @case ('expenses') {
          <app-trip-expenses-tab
            [trip]="t"
            [members]="expenseMembers()"
            [currentUserId]="currentUserId()"
            (addExpense)="openExpenseModal()"
            (editExpense)="openExpenseModal($event)"
            (deleteExpense)="deleteExpense($event)"
            (settle)="settleTransfer($event)" />
        }

        @case ('activities') {
          <app-trip-activities-tab
            [activities]="t.activities"
            [(searchQuery)]="activitySearchQuery"
            (addActivity)="isActivityModalOpen.set(true)"
            (assignActivity)="openAssignDayModal($event, 'activity')"
            (deleteActivity)="deleteActivity($event)" />
        }
      }

    } @else {
      <!-- Trip Not Found Card -->
      <div class="not-found card">
        <span class="material-symbols-outlined not-found-icon">search_off</span>
        <h2 class="not-found-title">Viaggio non trovato</h2>
        <p class="not-found-desc">Il viaggio richiesto non esiste o è stato rimosso.</p>
        <button type="button" class="btn btn-primary" (click)="goToTrips()">
          Torna ai viaggi
        </button>
      </div>
    }

  </div>
</div>

<!-- Modals -->
<app-trip-activity-modal
  [isOpen]="isActivityModalOpen()"
  (closed)="isActivityModalOpen.set(false)"
  (saved)="saveActivity($event)" />

<app-trip-place-modal
  [isOpen]="isPlaceModalOpen()"
  (closed)="isPlaceModalOpen.set(false)"
  (saved)="savePlaceToEat($event)" />

<app-trip-expense-modal
  [isOpen]="isExpenseModalOpen()"
  [expense]="editingExpense()"
  [members]="expenseMembers()"
  [currentUserId]="currentUserId()"
  [currency]="trip()?.currency || 'EUR'"
  (closed)="isExpenseModalOpen.set(false)"
  (saved)="saveExpense($event)" />

<app-trip-assign-modal
  [isOpen]="isAssignModalOpen()"
  [itemName]="assigningItemName()"
  [days]="tripDaysNumbers()"
  [startDate]="trip()?.startDate"
  [initialDay]="assignInitialDay()"
  [initialTimeSlot]="assignInitialTimeSlot()"
  (closed)="isAssignModalOpen.set(false)"
  (confirmed)="confirmAssignDay($event)" />

<app-trip-flights-modal
  [isOpen]="isFlightsModalOpen()"
  [flights]="trip()?.flights"
  (closed)="isFlightsModalOpen.set(false)"
  (saved)="saveFlights($event)" />

<app-trip-transfers-modal
  [isOpen]="isTransfersModalOpen()"
  [transfers]="trip()?.transfers"
  (closed)="isTransfersModalOpen.set(false)"
  (saved)="saveTransfers($event)" />

<app-trip-accommodation-modal
  [isOpen]="isAccommodationModalOpen()"
  [trip]="trip()"
  (closed)="isAccommodationModalOpen.set(false)"
  (saved)="saveAccommodation($event)" />
