<div class="auth-page">
  <div class="auth-card card-glass animate-slide-up">
    <!-- Brand Header -->
    <div class="auth-header">
      <div class="brand-badge">
        <span class="material-symbols-outlined">travel_explore</span>
      </div>
      <h1 class="auth-title">Bentornato su Wander<span class="brand-highlight">Bite</span></h1>
      <p class="auth-subtitle">Accedi per organizzare i viaggi e le soste gastronomiche con i tuoi compagni di avventura.</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-input" 
          placeholder="alessandro@example.com">
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <span class="form-error">Inserisci un indirizzo email valido.</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-input" 
          placeholder="••••••••">
      </div>

      <button 
        type="submit" 
        class="btn btn-primary w-full mt-2"
        [disabled]="loginForm.invalid">
        Accedi a WanderBite
      </button>
    </form>

    <div class="auth-footer">
      <p>Non hai ancora un account? <a routerLink="/register">Registrati ora</a></p>
    </div>
  </div>
</div>
