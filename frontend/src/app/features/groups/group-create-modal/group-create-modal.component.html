<app-modal 
  [isOpen]="isOpen" 
  title="Crea Nuovo Gruppo di Viaggio" 
  icon="group"
  (close)="onClose()">
  
  <form [formGroup]="groupForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label" for="name">Nome del Gruppo *</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        class="form-input" 
        placeholder="Es. Foodies on Tour, Weekend Fuoriporta...">
      @if (groupForm.get('name')?.touched && groupForm.get('name')?.invalid) {
        <span class="form-error">Il nome del gruppo è obbligatorio (minimo 3 caratteri).</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Descrizione & Obiettivo</label>
      <textarea 
        id="description" 
        formControlName="description" 
        class="form-textarea" 
        rows="3" 
        placeholder="Es. Viaggi del weekend alla scoperta dei piatti tipici e itinerari panoramici..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Scegli un'icona / Emoji</label>
      <div class="emoji-grid">
        @for (emoji of emojiPresets; track emoji) {
          <button 
            type="button" 
            class="emoji-btn" 
            [class.selected]="groupForm.get('icon')?.value === emoji"
            (click)="groupForm.patchValue({ icon: emoji })">
            {{ emoji }}
          </button>
        }
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Colore a tema</label>
      <div class="color-grid">
        @for (color of colorPresets; track color) {
          <button 
            type="button" 
            class="color-btn" 
            [style.background-color]="color"
            [class.selected]="groupForm.get('color')?.value === color"
            (click)="groupForm.patchValue({ color: color })">
            @if (groupForm.get('color')?.value === color) {
              <span>✓</span>
            }
          </button>
        }
      </div>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn-secondary" (click)="onClose()">Annulla</button>
    <button 
      type="button" 
      class="btn btn-primary" 
      [disabled]="groupForm.invalid" 
      (click)="onSubmit()">
      <span class="material-symbols-outlined">add</span> Crea Gruppo
    </button>
  </div>
</app-modal>
