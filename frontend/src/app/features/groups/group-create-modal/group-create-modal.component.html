<app-modal
  [isOpen]="isOpen()"
  [title]="(isEditMode() ? 'groups.form_edit_title' : 'groups.form_create_title') | translate"
  [hasFooter]="true"
  (close)="onClose()">

  <form [formGroup]="groupForm" (ngSubmit)="onSubmit()">

    <!-- Name + thumbnail row -->
    <div class="form-group">
      <label class="form-label" for="gcm-name">{{ 'groups.form_name_label' | translate }}</label>
      <app-group-icon-picker [(icon)]="icon">
        <!-- Name input -->
        <div class="name-input-col">
          <input
            type="text"
            id="gcm-name"
            formControlName="name"
            class="form-input"
            [placeholder]="'groups.form_name_placeholder' | translate">
          @if (groupForm.controls.name.touched && groupForm.controls.name.invalid) {
            <span class="form-error">{{ 'groups.form_name_error' | translate }}</span>
          }
        </div>
      </app-group-icon-picker>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label" for="gcm-desc">{{ 'groups.form_desc_label' | translate }}</label>
      <textarea
        id="gcm-desc"
        formControlName="description"
        class="form-textarea"
        rows="2"
        [placeholder]="'groups.form_desc_placeholder' | translate"></textarea>
    </div>

    <!-- Invite users -->
    <div class="form-group">
      <app-group-invite-picker
        [group]="group()"
        [isEditMode]="isEditMode()"
        [(invitedIds)]="invitedUsers"
        [(search)]="inviteSearch" />
    </div>

  </form>

  <div modal-footer>
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="groupForm.invalid"
      (click)="onSubmit()">
      <span class="material-symbols-outlined">{{ isEditMode() ? 'save' : 'add' }}</span>
      {{ (isEditMode() ? 'groups.form_save' : 'groups.form_create') | translate }}
    </button>
  </div>

</app-modal>
