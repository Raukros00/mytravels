<label class="form-label">{{ 'groups.form_invite_label' | translate }}</label>
<app-user-search
  [placeholder]="'groups.form_invite_placeholder' | translate"
  [excludeIds]="memberIds()"
  [invitedIds]="invitedIds()"
  [actionLabel]="'groups.form_invite_action' | translate"
  (picked)="inviteUser($event)" />

@if (invited().length > 0) {
  <div class="invite-sent-section">
    <p class="invite-sent-label">{{ (isEditMode() ? 'groups.form_invited' : 'groups.form_will_invite') | translate }}</p>
    <div class="invite-sent-list">
      @for (user of invited(); track user.id) {
        <div class="invite-sent-pill">
          <app-user-avatar [user]="user" [size]="32" />
          <div class="invite-user-info">
            <span class="invite-user-name">{{ user.name }}</span>
          </div>
          <button type="button" class="btn-remove-invite" (click)="removeInvite(user.id)" title="Rimuovi">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      }
    </div>
  </div>
}
