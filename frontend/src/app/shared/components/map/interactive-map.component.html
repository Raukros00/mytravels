<div class="map-wrapper">
  <div #mapContainer class="leaflet-map-container"></div>
  
  @if (stops().length > 0) {
    <div class="map-floating-bar">
      <span class="stops-count"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">location_on</span> {{ stops().length }} {{ stops().length === 1 ? 'tappa' : 'tappe' }} sulla mappa</span>
      @if (showRoute()) {
        <span class="route-hint">Tracciato percorso giornaliero attivo</span>
      }
    </div>
  } @else {
    <div class="map-empty-overlay">
      <p>{{ emptyMessage() }}</p>
    </div>
  }
</div>
