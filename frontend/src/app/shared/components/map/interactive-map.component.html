<div class="map-wrapper">
  <div #mapContainer class="leaflet-map-container"></div>
  
  @if (stops && stops.length > 0) {
    <div class="map-floating-bar">
      <span class="stops-count">📍 {{ stops.length }} {{ stops.length === 1 ? 'tappa' : 'tappe' }} sulla mappa</span>
      <span class="route-hint">Tracciato percorso giornaliero attivo</span>
    </div>
  } @else {
    <div class="map-empty-overlay">
      <p>Nessuna posizione geolocalizzata per questa giornata. Aggiungi tappe o hotel con indirizzo!</p>
    </div>
  }
</div>
