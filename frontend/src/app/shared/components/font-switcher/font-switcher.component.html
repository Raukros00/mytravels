<div class="font-switcher">
  <button class="switcher-trigger" (click)="toggle()" title="Cambia font">
    <span class="trigger-icon">Aa</span>
  </button>

  @if (isOpen()) {
    <div class="switcher-panel">
      <p class="panel-label">Anteprima font</p>
      @for (opt of options; track opt.key) {
        <button
          class="font-option"
          [class.active]="active() === opt.key"
          (click)="select(opt.key)">
          <span class="option-name" [style.fontFamily]="opt.heading">{{ opt.label }}</span>
          <span class="option-detail">{{ opt.heading }} · {{ opt.body }}</span>
        </button>
      }
    </div>
  }
</div>
