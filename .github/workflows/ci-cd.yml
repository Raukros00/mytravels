name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment tag to publish (all, prod, test)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - prod
          - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: raukros00/mytravels-backend
  FRONTEND_IMAGE_NAME: raukros00/mytravels-frontend

jobs:
  backend-ci-cd:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        run: |
          cd backend
          mvn test --batch-mode

      - name: Set up QEMU (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ github.ref_name }}" == "develop" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:test"
            elif [ "${{ github.ref_name }}" == "main" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:prod"
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
            fi
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}

  frontend-ci-cd:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies and Build Angular App
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production

      - name: Set up QEMU (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ github.ref_name }}" == "develop" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:test"
            elif [ "${{ github.ref_name }}" == "main" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:prod"
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
            fi
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}