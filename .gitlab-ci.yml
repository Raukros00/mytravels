stages:
  - test
  - deploy

variables:
  DOCKER_IMAGE_FE: "app1-frontend:latest"
  DOCKER_IMAGE_BE: "app1-backend:latest"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.pool=false"

test_backend:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21
  cache:
    key: "maven-deps"
    paths:
      - .m2/repository/
  script:
    - echo "Esecuzione test automatici backend Spring Boot..."
    - cd backend
    - mvn test --batch-mode
  rules:
    - changes:
        - backend/**/*
  tags:
    - raspberry

deploy:
  stage: deploy
  image: docker:latest
  script:
    - echo "Pulizia eventuali container precedenti sulle porte 8081, 8082, 8083 e 27017..."
    - docker rm -f app1-frontend tripplanner-backend tripplanner-mongodb $(docker ps -aq --filter "publish=8081" --filter "publish=8082" --filter "publish=8083" --filter "publish=27017") 2>/dev/null || true
    - echo "Building e deploy di tutti i servizi (MongoDB, Backend, Frontend)..."
    - docker compose up -d --build --force-recreate
    - echo "Deploy completato con successo su https://app1.alessandrodominici.dev"
  only:
    - main
  tags:
    - raspberry



