stages:
  - deploy

variables:
  DOCKER_IMAGE_FE: "app1-frontend:latest"

deploy_frontend:
  stage: deploy
  image: docker:latest
  script:
    - echo "Building Docker image con i file statici pre-compilati..."
    - docker build -t $DOCKER_IMAGE_FE ./frontend
    - echo "Aggiornamento container tramite docker-compose..."
    - docker stop app1-frontend || true
    - docker rm app1-frontend || true
    - docker run -d --name app1-frontend --restart always -p 8081:80 $DOCKER_IMAGE_FE
    - echo "Deploy completato con successo su https://app1.alessandrodominici.dev"
  only:
    - main
  tags:
    - raspberry
