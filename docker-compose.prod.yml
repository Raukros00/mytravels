services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-wanderbite-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: wanderbite
      POSTGRES_USER: wanderbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderbite -d wanderbite"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-backend:prod
    container_name: prod-wanderbite-backend
    restart: unless-stopped
    ports:
      - "8093:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: wanderbite
      POSTGRES_USER: wanderbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-frontend:prod
    container_name: prod-wanderbite-frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - prod-network

networks:
  prod-network:
    name: wanderbite-prod-network
    driver: bridge

volumes:
  pg_data_prod:
    name: wanderbite-pg-data-prod
