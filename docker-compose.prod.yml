services:
  mongodb:
    image: mongo:4.4.18
    container_name: prod-wanderbite-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: wanderbite
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-backend:prod
    container_name: prod-wanderbite-backend
    restart: unless-stopped
    ports:
      - "8093:8080"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: wanderbite
    depends_on:
      - mongodb
    networks:
      - prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-frontend:prod
    container_name: prod-wanderbite-frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - prod-network

networks:
  prod-network:
    name: wanderbite-prod-network
    driver: bridge

volumes:
  mongo_data_prod:
    name: wanderbite-mongo-data-prod
