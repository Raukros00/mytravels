server:
  port: 8080

spring:
  application:
    name: trip-planner-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tripplanner}
    username: ${POSTGRES_USER:tripplanner}
    password: ${POSTGRES_PASSWORD:tripplanner}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_SHOW_SQL:false}
    # Log delle query SQL disattivato di default; JPA_SHOW_SQL=true per il debug.
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Origini consentite (lista separata da virgole, es. "https://a.example,http://localhost:4200").
    # Vuota = default nel codice: prod, test, localhost/127.0.0.1 sulle porte 4200 e 4300.
    # Se impostata SOSTITUISCE i default: per aggiungere un'origine elencare anche quelle di default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Dati demo (utenti/gruppi/viaggi di esempio). Disattivato di default; true solo in locale/test.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Limiti ai tentativi (in memoria, per singola istanza). I default valgono anche in produzione.
  # Durate in formato Spring (es. 15m, 1h, 60s). Superato il limite: 429 con Retry-After.
  rate-limit:
    login: # tentativi di accesso falliti, per email e per IP
      max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:15m}
    register: # registrazioni per IP
      max-attempts: ${RATE_LIMIT_REGISTER_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_REGISTER_WINDOW:1h}
    invite-preview: # anteprime di codici invito per IP
      max-attempts: ${RATE_LIMIT_INVITE_PREVIEW_MAX_ATTEMPTS:30}
      window: ${RATE_LIMIT_INVITE_PREVIEW_WINDOW:1m}
    # Solo e2e: endpoint per cambiare i limiti durante i test. Mai true in test/produzione.
    test-endpoint: ${RATE_LIMIT_TEST_ENDPOINT:false}

unsplash:
  # Copertine suggerite in base alla destinazione. Senza chiave la funzione è disattivata.
  access-key: ${UNSPLASH_ACCESS_KEY:}
  api-url: ${UNSPLASH_API_URL:https://api.unsplash.com}

geonames:
  # Suggerimenti di città (account gratuito su geonames.org con i "free web services" attivi).
  # Senza username la destinazione resta un campo di testo libero.
  username: ${GEONAMES_USERNAME:}
  api-url: ${GEONAMES_API_URL:https://secure.geonames.org}

photon:
  # Suggerimenti di attrazioni e indirizzi (Photon di Komoot, dati OpenStreetMap): nessuna chiave.
  # Vuota = indirizzo a testo libero. Può puntare anche a un'istanza propria di Photon.
  url: ${PHOTON_URL:https://photon.komoot.io/api}
  # Lingue dei nomi supportate dall'istanza; per le altre (es. "it") si usano i nomi locali.
  languages: ${PHOTON_LANGUAGES:de,en,fr}
  # User-Agent generico dell'app (uso corretto dell'istanza pubblica).
  user-agent: ${PHOTON_USER_AGENT:WanderBite/1.0 (+https://test.alessandrodominici.dev)}

wikidata:
  # Ricerca di monumenti e attrazioni con il nome nella lingua dell'utente ("Torre Eiffel", "Colosseo"),
  # in parallelo a Photon (dati CC0, nessuna chiave). Vuota = solo Photon.
  url: ${WIKIDATA_URL:https://www.wikidata.org/w/api.php}

open-meteo:
  # Meteo della giornata nella guida "In viaggio" (Open-Meteo: gratuito, senza chiave, dati CC BY 4.0).
  # Vuoto = guida senza meteo. Può puntare anche a un'istanza propria di Open-Meteo.
  url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}

places:
  # Raggio (km) attorno alla destinazione del viaggio entro cui cercare attrazioni e indirizzi.
  search-radius-km: ${PLACES_SEARCH_RADIUS_KM:40}

push:
  # Notifiche push (Web Push). Chiavi VAPID generate una volta per ambiente con
  # `npx web-push generate-vapid-keys` (base64url). Se una delle tre manca le push sono disattivate.
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    # Contatto per i push service: "mailto:..." oppure l'URL https del sito.
    subject: ${PUSH_VAPID_SUBJECT:}
  # Endpoint http consentiti (solo per i test e2e con il push service finto); in produzione solo https.
  allow-insecure-endpoints: ${PUSH_ALLOW_INSECURE_ENDPOINTS:false}
  # Per quanto il push service conserva una notifica se il dispositivo è spento (secondi).
  ttl-seconds: ${PUSH_TTL_SECONDS:86400}
  # Promemoria prima della partenza (3 giorni prima e il giorno prima), una sola volta per utente.
  reminders:
    enabled: ${PUSH_REMINDERS_ENABLED:true}
    # Cron di Spring sul fuso Europe/Rome: ogni 15 minuti dalle 9:00 alle 21:45 (il primo giro utile
    # invia; i successivi recuperano solo ciò che manca, es. dopo un riavvio).
    cron: ${PUSH_REMINDERS_CRON:0 */15 9-21 * * *}
    # Solo e2e: POST /api/v1/test/trip-reminders/run?date=yyyy-MM-dd esegue il job subito. Mai true in test/produzione.
    test-endpoint: ${PUSH_REMINDERS_TEST_ENDPOINT:false}
  # Guida durante il viaggio (#110): buongiorno, pasti, chiusure imminenti e fine giornata, una sola volta per evento.
  live-guide:
    enabled: ${PUSH_LIVE_GUIDE_ENABLED:true}
    # Cron di Spring sul fuso Europe/Rome: ogni 5 minuti dalle 7:00 alle 23:55.
    cron: ${PUSH_LIVE_GUIDE_CRON:0 */5 7-23 * * *}
    # Orari (ora italiana) del buongiorno con il programma e del riepilogo di fine giornata.
    morning-time: ${PUSH_LIVE_GUIDE_MORNING_TIME:08:30}
    evening-time: ${PUSH_LIVE_GUIDE_EVENING_TIME:21:30}
    # Una notifica parte entro questi minuti dal suo orario (es. dopo un riavvio), poi non più.
    grace-minutes: ${PUSH_LIVE_GUIDE_GRACE_MINUTES:60}
    # Solo e2e: POST /api/v1/test/live-guide/run?at=yyyy-MM-ddTHH:mm esegue il job subito. Mai true in test/produzione.
    test-endpoint: ${PUSH_LIVE_GUIDE_TEST_ENDPOINT:false}

jwt:
  # Obbligatorio: almeno 32 caratteri, diverso per ogni ambiente (es. `openssl rand -hex 32`).
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in ms
