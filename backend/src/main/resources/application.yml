server:
  port: 8080

spring:
  application:
    name: trip-planner-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tripplanner}
    username: ${POSTGRES_USER:tripplanner}
    password: ${POSTGRES_PASSWORD:tripplanner}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_SHOW_SQL:false}
    # Log delle query SQL disattivato di default; JPA_SHOW_SQL=true per il debug.
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # Dati demo (utenti/gruppi/viaggi di esempio). Disattivato di default; true solo in locale/test.
  seed-demo-data: ${SEED_DEMO_DATA:false}

unsplash:
  # Copertine suggerite in base alla destinazione. Senza chiave la funzione è disattivata.
  access-key: ${UNSPLASH_ACCESS_KEY:}
  api-url: ${UNSPLASH_API_URL:https://api.unsplash.com}

geonames:
  # Suggerimenti di città (account gratuito su geonames.org con i "free web services" attivi).
  # Senza username la destinazione resta un campo di testo libero.
  username: ${GEONAMES_USERNAME:}
  api-url: ${GEONAMES_API_URL:https://secure.geonames.org}

photon:
  # Suggerimenti di attrazioni e indirizzi (Photon di Komoot, dati OpenStreetMap): nessuna chiave.
  # Vuota = indirizzo a testo libero. Può puntare anche a un'istanza propria di Photon.
  url: ${PHOTON_URL:https://photon.komoot.io/api}
  # Lingue dei nomi supportate dall'istanza; per le altre (es. "it") si usano i nomi locali.
  languages: ${PHOTON_LANGUAGES:de,en,fr}
  # User-Agent generico dell'app (uso corretto dell'istanza pubblica).
  user-agent: ${PHOTON_USER_AGENT:WanderBite/1.0 (+https://test.alessandrodominici.dev)}

jwt:
  # Obbligatorio: almeno 32 caratteri, diverso per ogni ambiente (es. `openssl rand -hex 32`).
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in ms
