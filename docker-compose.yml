services:
  mongodb:
    image: mongo:4.4.18
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tripplanner}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/raukros00/mytravels-backend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8083}:8080"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE:-tripplanner}
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/raukros00/mytravels-frontend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-network
    driver: bridge

volumes:
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-mongo-data
