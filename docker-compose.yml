services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripplanner}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripplanner} -d ${POSTGRES_DB:-tripplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/raukros00/mytravels-backend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8083}:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripplanner}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET non impostata nel .env}
      # Origini CORS consentite: in locale l'app è servita dal container frontend sulla FRONTEND_PORT.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081},http://127.0.0.1:${FRONTEND_PORT:-8081},http://localhost:4200,http://127.0.0.1:4200}
      # Copertine suggerite (Unsplash, "Access Key"): vuota = funzione disattivata.
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # Suggerimenti di città (username GeoNames): vuoto = destinazione a testo libero.
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-}
      # Notifiche push (chiavi VAPID: npx web-push generate-vapid-keys): vuote = push disattivate.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      # Suggerimenti di attrazioni e indirizzi (Photon, dati OpenStreetMap): default l'istanza pubblica, vuoto = testo libero.
      PHOTON_URL: ${PHOTON_URL-https://photon.komoot.io/api}
      # Monumenti e attrazioni con il nome in italiano (Wikidata): default l'API pubblica, vuoto = solo Photon.
      WIKIDATA_URL: ${WIKIDATA_URL-https://www.wikidata.org/w/api.php}
      # Meteo della giornata nella guida (Open-Meteo, senza chiave): default l'API pubblica, vuoto = niente meteo.
      OPEN_METEO_URL: ${OPEN_METEO_URL-https://api.open-meteo.com/v1/forecast}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/raukros00/mytravels-frontend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-network
    driver: bridge

volumes:
  pg_data:
    name: ${COMPOSE_PROJECT_NAME:-mytravels-test}-pg-data
