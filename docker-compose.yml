services:
  mongodb:
    image: mongo:4.4.18
    container_name: tripplanner-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tripplanner
    volumes:
      - mongo_data:/data/db
    networks:
      - app1-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-backend:latest
    container_name: tripplanner-backend
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: tripplanner
    depends_on:
      - mongodb
    networks:
      - app1-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-frontend:latest
    container_name: app1-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app1-network

networks:
  app1-network:
    driver: bridge

volumes:
  mongo_data:
