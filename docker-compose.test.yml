services:
  postgres:
    image: postgres:16-alpine
    container_name: test-tripplanner-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tripplanner
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
    volumes:
      - pg_data_test:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner -d tripplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-backend:latest
    container_name: test-tripplanner-backend
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tripplanner
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/raukros00/mytravels-frontend:latest
    container_name: test-tripplanner-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - test-network

networks:
  test-network:
    name: mytravels-test-network
    driver: bridge

volumes:
  pg_data_test:
    name: mytravels-pg-data-test
