services:
  postgres:
    image: postgres:16-alpine
    container_name: test-tripplanner-postgres
    restart: unless-stopped
    # Esposto solo su localhost: raggiungibile dal server o via tunnel SSH, non dalla LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5443}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD non impostata nel .env}
    volumes:
      - pg_data_test:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Il database non va aggiornato in automatico da Watchtower.
      com.centurylinklabs.watchtower.enable: "false"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/raukros00/mytravels-backend:test}
    container_name: test-tripplanner-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8093}:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
      POSTGRES_USER: ${POSTGRES_USER:-tripplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD non impostata nel .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET non impostata nel .env}
      # Copertine suggerite (Unsplash, "Access Key"): vuota = funzione disattivata.
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # Suggerimenti di città (username GeoNames): vuoto = destinazione a testo libero.
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-}
      # Suggerimenti di attrazioni e indirizzi (Photon, dati OpenStreetMap): default l'istanza pubblica, vuoto = testo libero.
      PHOTON_URL: ${PHOTON_URL-https://photon.komoot.io/api}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/raukros00/mytravels-frontend:test}
    container_name: test-tripplanner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8091}:80"
    depends_on:
      - backend
    networks:
      - test-network

networks:
  test-network:
    name: mytravels-test-network
    driver: bridge

volumes:
  pg_data_test:
    name: mytravels-pg-data-test
